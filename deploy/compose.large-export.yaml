# Opt in after the target environment passes the large-export gate.
services:
  data-query-worker:
    init: true
    environment:
      DQW_MAX_RESULT_ROWS: "10000000"
      DQW_DUCKDB_MEMORY_LIMIT: "256MB"
      DQW_MAX_RESULT_BYTES: "2147483648"
      DQW_QUERY_TIMEOUT_SECONDS: "900"
      DQW_INGESTION_TIMEOUT_SECONDS: "1800"
      DQW_RESULT_TTL_SECONDS: "86400"
