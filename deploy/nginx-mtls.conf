server {
    listen 8443 ssl;
    server_name query-tls;
    ssl_certificate /run/query-tls/server.crt;
    ssl_certificate_key /run/query-tls/server.key;
    ssl_client_certificate /run/query-tls/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Do not log result URLs, SQL bodies, Authorization, or client credentials.
    access_log off;
    client_max_body_size 21g;
    client_body_timeout 1800s;
    location / {
        proxy_pass http://data-query-worker:8080;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
}
