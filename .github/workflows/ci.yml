name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --cov=omero_data_query_worker --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: ruff check .
      - if: matrix.python-version == '3.12'
        run: ruff format --check .
      - if: matrix.python-version == '3.12'
        run: mypy src

  container-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python scripts/smoke_container.py

  image-security:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag omero-data-query-worker:ci .
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: omero-data-query-worker:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@v0.21.0
        with:
          image: omero-data-query-worker:ci
          artifact-name: omero-data-query-worker.spdx.json
          output-file: omero-data-query-worker.spdx.json

