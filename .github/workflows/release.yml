name: Publish container

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require tag to match package version
        shell: bash
        run: python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
      - name: Verify SSH-signed release tag
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/release-signers
          git verify-tag "${GITHUB_REF_NAME}"
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: python scripts/smoke_container.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: cellularimagingcf/omero-data-query-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/cellularimagingcf/omero-data-query-worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
