name: Copy released 0.2.2 to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-worker-0.2.2
  cancel-in-progress: false

jobs:
  copy-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install registry copy tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Copy the immutable release including both platforms and attestations
        env:
          SOURCE: ghcr.io/nl-bioimaging/omero-data-query-worker
          TARGET: docker.io/cellularimagingcf/omero-data-query-worker:0.2.2
          DIGEST: sha256:96620294ab7be707952cc94184a70bea86220c2ca257db7e14d489741bfc8c1b
        shell: bash
        run: |
          set -euo pipefail
          authfile="$HOME/.docker/config.json"
          source_manifest="$RUNNER_TEMP/worker-source.json"
          target_manifest="$RUNNER_TEMP/worker-target.json"
          skopeo inspect --raw "docker://${SOURCE}@${DIGEST}" > "$source_manifest"
          test "sha256:$(sha256sum "$source_manifest" | cut -d ' ' -f 1)" = "$DIGEST"
          if skopeo inspect --authfile "$authfile" --raw "docker://${TARGET}" > "$target_manifest" 2> "$RUNNER_TEMP/target-error"; then
            cmp "$source_manifest" "$target_manifest"
            echo 'The identical release is already present; no files changed.'
            exit 0
          fi
          # An authentication/network error is not evidence that the tag is absent.
          grep -qi 'manifest unknown' "$RUNNER_TEMP/target-error" || {
            cat "$RUNNER_TEMP/target-error"
            exit 1
          }
          skopeo copy --all --preserve-digests --retry-times 3 --authfile "$authfile" \
            "docker://${SOURCE}@${DIGEST}" "docker://${TARGET}"
          skopeo inspect --raw "docker://${TARGET}" > "$target_manifest"
          cmp "$source_manifest" "$target_manifest"
          echo "Copied and verified ${TARGET}@${DIGEST}"
